SCHEMEEOF

    - name: Build the Fixed Project
      run: |
        cd "Pinger Project"
        
        echo "=== Verifying Project Structure ==="
        ls -la
        echo "=== Pinger Directory ==="
        ls -la Pinger/
        echo "=== Project File ==="
        ls -la Pinger.xcodeproj/
        
        echo "=== Building Project ==="
        xcodebuild -project Pinger.xcodeproj \
                   -scheme Pinger \
                   -configuration Release \
                   -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
                   -derivedDataPath ../build/DerivedData \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   DEVELOPMENT_TEAM="" \
                   PROVISIONING_PROFILE_SPECIFIER="" \
                   -verbose
                   
    - name: Package the Built App
      run: |
        echo "=== Looking for Built App ==="
        find build -name "*.app" -type d
        
        if [ -d "build/DerivedData/Build/Products/Release-iphonesimulator/Pinger.app" ]; then
          echo "SUCCESS: Found built app!"
          
          # Copy app to build root
          cp -R "build/DerivedData/Build/Products/Release-iphonesimulator/Pinger.app" build/
          
          # Create IPA structure
          mkdir -p build/Payload
          cp -R build/Pinger.app build/Payload/
          
          # Create IPA file
          cd build
          zip -r Pinger-iOS-Real.ipa Payload/
          zip -r Pinger-iOS-App.zip Pinger.app/
          
          echo "=== SUCCESS: Built Real iOS App ==="
          ls -lh *.ipa *.zip
          du -sh Pinger.app
          
        else
          echo "ERROR: App still not found after fixed build"
          echo "=== Build Output Structure ==="
          find build -type f -name "*.app" -o -name "*.o" -o -name "*.dylib" | head -20
          exit 1
        fi
    
    - name: Upload iOS App for Appetize
      uses: actions/upload-artifact@v4
      with:
        name: Pinger-iOS-App
        path: |
          build/*.zip
          build/*.app
          build/*.ipa
        retention-days: 30
        
    - name: Upload Build Logs
      uses: actions/upload-artifact@v4  
      if: always()
      with:
        name: Build-Logs
        path: |
          build/DerivedData/Logs
          *.log
        retention-days: 7