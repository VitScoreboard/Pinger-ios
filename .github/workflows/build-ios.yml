name: Build iOS App for Appetize - FIXED

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Create Brand New iOS Project
      run: |
        echo "=== Creating completely new iOS project from scratch ==="
        
        # Remove the broken existing project
        rm -rf Pinger.xcodeproj
        
        # Create new iOS project using Xcode template
        mkdir -p PingerNew
        cd PingerNew
        
        # Create new single view app project
        /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild -project - << 'EOF' || echo "Using alternative project creation"
        EOF
        
        # Alternative: Create project structure manually but correctly
        cd ..
        
        # Create proper project directory
        mkdir -p "Pinger Project/Pinger"
        
        # Copy source files to proper location
        cp *.swift "Pinger Project/Pinger/" 2>/dev/null || true
        cp *.storyboard "Pinger Project/Pinger/" 2>/dev/null || true
        cp Info.plist "Pinger Project/Pinger/" 2>/dev/null || true
        cp -r Assets.xcassets "Pinger Project/Pinger/" 2>/dev/null || true
        
        # Create minimal but correct Xcode project
        mkdir -p "Pinger Project/Pinger.xcodeproj"
        
        # Generate working project.pbxproj
        cat > "Pinger Project/Pinger.xcodeproj/project.pbxproj" << 'PBXEOF'
